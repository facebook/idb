name: idb_companion

# The prebuilt products of the generated FBSimulatorControl project that
# idb_companion and idb-repl link are derived from the Buck graph into
# project-deps.yml. XcodeGen merges its dependency lists into the targets below.
include:
  - project-deps.yml

options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  bundleIdPrefix: com.facebook

configFiles:
  Debug: ../Configuration/Debug.xcconfig
  Release: ../Configuration/Release.xcconfig

settings:
  base:
    SYSTEM_HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/../PrivateHeaders
    LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Resources/Swift

packages:
  grpc-swift-2:
    url: https://github.com/grpc/grpc-swift-2.git
    exactVersion: 2.4.3
  grpc-swift-nio-transport:
    url: https://github.com/grpc/grpc-swift-nio-transport.git
    exactVersion: 2.9.2
  grpc-swift-protobuf:
    url: https://github.com/grpc/grpc-swift-protobuf.git
    exactVersion: 2.4.1
  swift-protobuf:
    url: https://github.com/apple/swift-protobuf.git
    exactVersion: 1.38.1
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser.git
    exactVersion: 1.8.2
  # Transitive dependencies of the gRPC packages, pinned to the versions the
  # internal build imports so the two dependency graphs stay identical.
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    exactVersion: 2.101.3
  swift-nio-ssl:
    url: https://github.com/apple/swift-nio-ssl.git
    exactVersion: 2.37.2
  swift-nio-http2:
    url: https://github.com/apple/swift-nio-http2.git
    exactVersion: 1.45.0
  swift-nio-extras:
    url: https://github.com/apple/swift-nio-extras.git
    exactVersion: 1.34.3
  swift-log:
    url: https://github.com/apple/swift-log.git
    exactVersion: 1.14.0
  swift-collections:
    url: https://github.com/apple/swift-collections.git
    exactVersion: 1.6.0
  swift-certificates:
    url: https://github.com/apple/swift-certificates.git
    exactVersion: 1.19.4
  swift-asn1:
    url: https://github.com/apple/swift-asn1.git
    exactVersion: 1.7.1
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    exactVersion: 4.5.2
  swift-async-algorithms:
    url: https://github.com/apple/swift-async-algorithms.git
    exactVersion: 1.1.5
  swift-service-lifecycle:
    url: https://github.com/swift-server/swift-service-lifecycle.git
    exactVersion: 2.12.0
  swift-atomics:
    url: https://github.com/apple/swift-atomics.git
    exactVersion: 1.3.1

targets:
  # Xcode folds linked SwiftPM products into static archives. Keep these package
  # edges compile-only; CompanionLib owns the package object code once below.
  IDBGRPCSwift:
    type: library.static
    platform: macOS
    deploymentTarget: "15.0"
    preBuildScripts:
      - name: Check gRPC Swift files exist
        script: |
          set -e
          OUTPUT_DIR="${SRCROOT}/../IDBGRPCSwift"

          if [ -f "$OUTPUT_DIR/idb.pb.swift" ] && [ -f "$OUTPUT_DIR/idb.grpc.swift" ]; then
            echo "gRPC Swift files exist"
            exit 0
          fi

          echo "error: gRPC Swift files not found. Run: ./build.sh generate-proto"
          exit 1
        inputFiles:
          - $(SRCROOT)/../proto/idb.proto
        outputFiles:
          - $(SRCROOT)/../IDBGRPCSwift/idb.pb.swift
          - $(SRCROOT)/../IDBGRPCSwift/idb.grpc.swift
    sources:
      - path: ../IDBGRPCSwift
        optional: true
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.facebook.IDBGRPCSwift
        PRODUCT_NAME: IDBGRPCSwift
        DEFINES_MODULE: YES
        MACH_O_TYPE: staticlib
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
      # Static archive: keep DWARF for the final link's dSYM, never strip.
      configs:
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf
          STRIP_INSTALLED_PRODUCT: NO
    dependencies:
      - package: grpc-swift-2
        product: GRPCCore
        link: false
      - package: grpc-swift-nio-transport
        product: GRPCNIOTransportHTTP2Posix
        link: false
      - package: grpc-swift-protobuf
        product: GRPCProtobuf
        link: false
      - package: swift-protobuf
        product: SwiftProtobuf
        link: false
      - sdk: Foundation.framework

  ReplProtocol:
    type: framework
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: ../REPL/ReplProtocol
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.facebook.ReplProtocol
        PRODUCT_NAME: ReplProtocol
        DEFINES_MODULE: YES
        MACH_O_TYPE: staticlib
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
      # Static archive: keep DWARF for the final link's dSYM, never strip.
      configs:
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf
          STRIP_INSTALLED_PRODUCT: NO
    dependencies:
      - sdk: CoreGraphics.framework
      - sdk: Foundation.framework

  # Xcode and Buck both build these sources as the `CompanionLib` static
  # library. Xcode links the shared SwiftPM products into this archive once;
  # IDBGRPCSwift's compile-only edges preserve its module visibility without
  # folding in a second copy.
  CompanionLib:
    type: library.static
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: ../CompanionLib
        excludes:
          - "**/*-Info.plist"
      # BuildInfo.swift is generated into DERIVED_FILE_DIR by the preBuildScript
      # below; the configuration reports `kBuildDate` / `kBuildTime`. The
      # declarations are internal, so the library and the tool each compile
      # their own copy, as they do under Buck.
      - path: $(DERIVED_FILE_DIR)/BuildInfo.swift
        optional: true
        type: file
    preBuildScripts:
      - name: Generate BuildInfo.swift
        script: |
          set -e
          mkdir -p "$DERIVED_FILE_DIR"
          {
            date +'let kBuildDate = "%b %-d %Y"'
            date +'let kBuildTime = "%H:%M:%S"'
          } > "$DERIVED_FILE_DIR/BuildInfo.swift"
        # No inputFiles means Xcode runs this every build (the timestamp must
        # always be fresh).
        outputFiles:
          - $(DERIVED_FILE_DIR)/BuildInfo.swift
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.facebook.CompanionLib
        PRODUCT_NAME: CompanionLib
        DEFINES_MODULE: YES
        MACH_O_TYPE: staticlib
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        SYSTEM_HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/../PrivateHeaders
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../Build/Products/Release
        # The linked static archives ship loose .swiftmodule directories next
        # to the .a files; resolve them independently of -F framework semantics.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../Build/Products/Release
      # Static archive: keep DWARF for the final link's dSYM, never strip.
      configs:
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf
          STRIP_INSTALLED_PRODUCT: NO
    dependencies:
      - target: IDBGRPCSwift
        embed: false
        link: false
      - target: ReplProtocol
        embed: false
        link: false
      - package: grpc-swift-2
        product: GRPCCore
      - package: grpc-swift-nio-transport
        product: GRPCNIOTransportHTTP2Posix
      - package: grpc-swift-protobuf
        product: GRPCProtobuf
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-protobuf
        product: SwiftProtobuf
      - sdk: CoreGraphics.framework
      - sdk: Foundation.framework

  idb_companion:
    type: tool
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      # The entry point alone; everything else it drives is CompanionLib.
      - path: main.swift
        type: file
      # BuildInfo.swift is generated into DERIVED_FILE_DIR by the preBuildScript
      # below. xcodegen needs a concrete pbxproj reference so the swiftc invocation
      # picks it up. Using `optional: true` allows xcodegen to add the reference
      # even though the file doesn't exist at project-generation time.
      - path: $(DERIVED_FILE_DIR)/BuildInfo.swift
        optional: true
        type: file
    preBuildScripts:
      - name: Generate BuildInfo.swift
        # Stamp build date/time into a Swift file inside DERIVED_FILE_DIR so that
        # main.swift can reference `kBuildDate` / `kBuildTime`.
        script: |
          set -e
          mkdir -p "$DERIVED_FILE_DIR"
          {
            date +'let kBuildDate = "%b %-d %Y"'
            date +'let kBuildTime = "%H:%M:%S"'
          } > "$DERIVED_FILE_DIR/BuildInfo.swift"
        # No inputFiles means Xcode runs this every build (the timestamp must
        # always be fresh).
        outputFiles:
          - $(DERIVED_FILE_DIR)/BuildInfo.swift
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_NAME: idb_companion
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_INTERFACE_HEADER_NAME: idb-Swift.h
        INFOPLIST_FILE: $(SRCROOT)/Info.plist
        SYSTEM_HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/../PrivateHeaders
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../Build/Products/Release
        # The linked static archives ship loose .swiftmodule directories next
        # to the .a files; resolve them independently of -F framework semantics.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../Build/Products/Release
        # FBControlCore and XCTestBootstrap contain category-only Objective-C
        # object files. Keep -ObjC so those members survive the final link, but
        # do not force-load the same archives that project-deps.yml already links.
        #
        # CoreSimulator and AccessibilityPlatformTranslation are runtime-loaded
        # private frameworks. FBSimulatorControl used to weak-link their TBD stubs
        # at its own link step, but a static archive has no link step, so the final
        # executable must carry the weak links instead.
        OTHER_LDFLAGS: $(inherited) -ObjC -weak_library $(SRCROOT)/../PrivateHeaders/CoreSimulator/CoreSimulator.tbd -weak_library $(SRCROOT)/../PrivateHeaders/AccessibilityPlatformTranslation/AccessibilityPlatformTranslation.tbd
        # Use ad-hoc code signing for local development
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        # Add rpath to find frameworks in same directory and PackageFrameworks
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path @executable_path/../Frameworks @executable_path/PackageFrameworks
      # Linked tool: strip DWARF into a dSYM in Release.
      configs:
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          STRIP_INSTALLED_PRODUCT: YES
    # Not the import list -- main.swift imports only CompanionLib of these.
    # Every framework here is a staticlib, so the tool is the one link step in
    # the build and has to name each archive that goes into it, including the
    # ones it reaches only through CompanionLib. Buck propagates those through
    # `exported_deps` instead, which is why `:idb-companion` names fewer.
    dependencies:
      - target: CompanionLib
        embed: false
      - target: IDBGRPCSwift
        embed: false
      - target: ReplProtocol
        embed: false
      - sdk: Foundation.framework

  CompanionDiscovery:
    type: framework
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: ../CompanionDiscovery
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.facebook.CompanionDiscovery
        PRODUCT_NAME: CompanionDiscovery
        DEFINES_MODULE: YES
        MACH_O_TYPE: staticlib
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
      # Static archive: keep DWARF for the final link's dSYM, never strip.
      configs:
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf
          STRIP_INSTALLED_PRODUCT: NO
    dependencies:
      - sdk: Foundation.framework

  # The shared REPL Swift compiler. Generates the wrapped source and drives swiftc; linked by idb-repl to compile
  # injected code client-side. Foundation-only.
  ReplCompiler:
    type: framework
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: ../REPL/Compiler
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.facebook.ReplCompiler
        PRODUCT_NAME: ReplCompiler
        DEFINES_MODULE: YES
        MACH_O_TYPE: staticlib
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
      # Static archive: keep DWARF for the final link's dSYM, never strip.
      configs:
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf
          STRIP_INSTALLED_PRODUCT: NO
    dependencies:
      - sdk: Foundation.framework

  # The `idb-repl` CLI. A small gRPC client that talks to a companion to drive a test/simulator REPL. It links the
  # IDBGRPCSwift static archive and owns the gRPC/NIO/protobuf package products
  # at its final executable link, matching the companion's single-owner model.
  # It is placed in the distribution next to idb_companion.
  idb-repl:
    type: tool
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: ../REPL/CLI
      # BuildInfo.swift is generated into DERIVED_FILE_DIR by the preBuildScript
      # below; main.swift references `kBuildDate` / `kBuildTime`. `optional: true`
      # lets xcodegen add the reference before the file exists at generation time.
      - path: $(DERIVED_FILE_DIR)/BuildInfo.swift
        optional: true
        type: file
    preBuildScripts:
      - name: Generate BuildInfo.swift
        # Stamp build date/time into a Swift file inside DERIVED_FILE_DIR.
        script: |
          set -e
          mkdir -p "$DERIVED_FILE_DIR"
          {
            date +'let kBuildDate = "%b %-d %Y"'
            date +'let kBuildTime = "%H:%M:%S"'
          } > "$DERIVED_FILE_DIR/BuildInfo.swift"
        # No inputFiles means Xcode runs this every build (the timestamp must
        # always be fresh).
        outputFiles:
          - $(DERIVED_FILE_DIR)/BuildInfo.swift
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_NAME: idb-repl
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        # The entry point is `@main struct TestRepl` in main.swift. Without
        # -parse-as-library, Swift treats a file named main.swift as top-level
        # script code, which conflicts with @main ("'main' attribute cannot be
        # used in a module that contains top-level code").
        OTHER_SWIFT_FLAGS: $(inherited) -parse-as-library
        # Use ad-hoc code signing for local development
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        # The linked static archives ship loose .swiftmodule directories next
        # to the .a files; resolve them independently of -F framework semantics.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../Build/Products/Release
      # Linked tool: strip DWARF into a dSYM in Release.
      configs:
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          STRIP_INSTALLED_PRODUCT: YES
    dependencies:
      - target: IDBGRPCSwift
        embed: false
      - target: CompanionDiscovery
        embed: false
      - target: ReplCompiler
        embed: false
      - package: grpc-swift-2
        product: GRPCCore
      - package: grpc-swift-nio-transport
        product: GRPCNIOTransportHTTP2Posix
      - package: grpc-swift-protobuf
        product: GRPCProtobuf
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-protobuf
        product: SwiftProtobuf
      - package: swift-argument-parser
        product: ArgumentParser
      - sdk: Foundation.framework


  sim-video:
    type: tool
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: ../Tools/VideoRecorder/CLI
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_NAME: sim-video
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        OTHER_SWIFT_FLAGS: $(inherited) -parse-as-library
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        SYSTEM_HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/../PrivateHeaders
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../Build/Products/Release
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../Build/Products/Release
        OTHER_LDFLAGS: $(inherited) -ObjC -weak_library $(SRCROOT)/../PrivateHeaders/CoreSimulator/CoreSimulator.tbd -weak_library $(SRCROOT)/../PrivateHeaders/AccessibilityPlatformTranslation/AccessibilityPlatformTranslation.tbd
      configs:
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          STRIP_INSTALLED_PRODUCT: YES
    dependencies:
      - package: swift-argument-parser
        product: ArgumentParser
      - sdk: AVFoundation.framework
      - sdk: Foundation.framework
