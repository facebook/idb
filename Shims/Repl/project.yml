name: Repl

options:
  createIntermediateGroups: true

targets:
  # DYLD-injected REPL shims (libRepl-iOS / libRepl-macOS).
  Repl-iOS:
    type: library.dynamic
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        excludes:
          - "**/*.xcodeproj"
          - "project.yml"
          - "Build"
          - "RuntimeProbe"
    settings:
      base:
        SDKROOT: iphonesimulator
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        PRODUCT_NAME: Repl-iOS
        EXECUTABLE_PREFIX: lib
        CURRENT_PROJECT_VERSION: 1
        DYLIB_CURRENT_VERSION: 1
        DYLIB_COMPATIBILITY_VERSION: 1
        COPY_PHASE_STRIP: NO
        CODE_SIGN_IDENTITY: "-"
        CLANG_ENABLE_OBJC_ARC: NO
        GCC_PREPROCESSOR_DEFINITIONS: $(inherited) SENTEST_IGNORE_DEPRECATION_WARNING=1
        OTHER_CFLAGS: $(inherited) -Wno-deprecated-declarations
        # TestRepl subclasses XCTestCase (forward-declared in XCTestPrivate.h, not
        # linked). The class is provided by the xctest host this dylib is injected
        # into, so defer the XCTestCase superclass symbol to runtime resolution.
        # -headerpad_max_install_names: package managers rewrite the dylib
        # install ID to their install prefix; leave header slack so the longer
        # path fits without relinking.
        OTHER_LDFLAGS: $(inherited) -undefined dynamic_lookup -headerpad_max_install_names
        # Nothing in this target is Swift, so Xcode does not add the Swift back-deployment libraries ReplRuntimeProbe links.
        LIBRARY_SEARCH_PATHS: $(inherited) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME)
    dependencies:
      - sdk: Foundation.framework
      - link: true
        target: ReplRuntimeProbe-iOS

  Repl-macOS:
    type: library.dynamic
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: .
        excludes:
          - "**/*.xcodeproj"
          - "project.yml"
          - "Build"
          - "RuntimeProbe"
    settings:
      base:
        SDKROOT: macosx
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_NAME: Repl-macOS
        EXECUTABLE_PREFIX: lib
        CURRENT_PROJECT_VERSION: 1
        DYLIB_CURRENT_VERSION: 1
        DYLIB_COMPATIBILITY_VERSION: 1
        COPY_PHASE_STRIP: NO
        CODE_SIGN_IDENTITY: "-"
        CLANG_ENABLE_OBJC_ARC: NO
        GCC_PREPROCESSOR_DEFINITIONS: $(inherited) SENTEST_IGNORE_DEPRECATION_WARNING=1
        OTHER_CFLAGS: $(inherited) -Wno-deprecated-declarations
        # See Repl-iOS: XCTestCase is provided by the injected xctest host, and
        # the headerpad leaves room for install-name rewriting.
        OTHER_LDFLAGS: $(inherited) -undefined dynamic_lookup -headerpad_max_install_names
        # Nothing in this target is Swift, so Xcode does not add the Swift back-deployment libraries ReplRuntimeProbe links.
        LIBRARY_SEARCH_PATHS: $(inherited) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME)
    dependencies:
      - sdk: Foundation.framework
      - link: true
        target: ReplRuntimeProbe-macOS

  # The Swift interface generator the shims' Objective-C calls through
  # FBReplGenerateSwiftInterface, as a static library so each shim is Objective-C alone.
  ReplRuntimeProbe-iOS:
    type: library.static
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RuntimeProbe
    settings:
      base:
        SDKROOT: iphonesimulator
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        PRODUCT_MODULE_NAME: ReplRuntimeProbe

  ReplRuntimeProbe-macOS:
    type: library.static
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: RuntimeProbe
    settings:
      base:
        SDKROOT: macosx
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_MODULE_NAME: ReplRuntimeProbe

  # The idb command API (`IDB`, module `IDBAPI`) as dylibs of their own, which idb-repl injects
  # alongside libRepl; the shim itself carries no idb API. `ReplCommand` (module `ReplProtocol`)
  # is linked into each statically.
  ReplProtocol-iOS:
    type: library.static
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ../../REPL/ReplProtocol
    settings:
      base:
        SDKROOT: iphonesimulator
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_NAME: ReplProtocol-iOS
        PRODUCT_MODULE_NAME: ReplProtocol
        SWIFT_VERSION: "6.0"

  ReplProtocol-macOS:
    type: library.static
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: ../../REPL/ReplProtocol
    settings:
      base:
        SDKROOT: macosx
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_NAME: ReplProtocol-macOS
        PRODUCT_MODULE_NAME: ReplProtocol
        SWIFT_VERSION: "6.0"

  ReplIDB-iOS:
    type: library.dynamic
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ../../REPL/IDB
        excludes:
          - "*.swiftinterface"
    settings:
      base:
        SDKROOT: iphonesimulator
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_NAME: ReplIDB-iOS
        PRODUCT_MODULE_NAME: IDBAPI
        EXECUTABLE_PREFIX: lib
        SWIFT_VERSION: "6.0"
        CURRENT_PROJECT_VERSION: 1
        DYLIB_CURRENT_VERSION: 1
        DYLIB_COMPATIBILITY_VERSION: 1
        COPY_PHASE_STRIP: NO
        CODE_SIGN_IDENTITY: "-"
        OTHER_LDFLAGS: $(inherited) -headerpad_max_install_names
    dependencies:
      - target: ReplProtocol-iOS
        link: true
      - sdk: Foundation.framework
      - sdk: CoreGraphics.framework
      - sdk: ImageIO.framework

  ReplIDB-macOS:
    type: library.dynamic
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: ../../REPL/IDB
        excludes:
          - "*.swiftinterface"
    settings:
      base:
        SDKROOT: macosx
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_NAME: ReplIDB-macOS
        PRODUCT_MODULE_NAME: IDBAPI
        EXECUTABLE_PREFIX: lib
        SWIFT_VERSION: "6.0"
        CURRENT_PROJECT_VERSION: 1
        DYLIB_CURRENT_VERSION: 1
        DYLIB_COMPATIBILITY_VERSION: 1
        COPY_PHASE_STRIP: NO
        CODE_SIGN_IDENTITY: "-"
        OTHER_LDFLAGS: $(inherited) -headerpad_max_install_names
    dependencies:
      - target: ReplProtocol-macOS
        link: true
      - sdk: Foundation.framework
      - sdk: CoreGraphics.framework
      - sdk: ImageIO.framework
