name: Shimulator

options:
  createIntermediateGroups: true

targets:
  SimulatorIPC-iOS:
    type: library.static
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../../SimulatorIPC
    settings:
      base:
        SDKROOT: iphonesimulator
        PRODUCT_MODULE_NAME: SimulatorIPC
        SWIFT_VERSION: "6.0"
    dependencies:
      - sdk: Foundation.framework

  ShimulatorProtocol-iOS:
    type: library.static
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Protocol
    settings:
      base:
        SDKROOT: iphonesimulator
        PRODUCT_MODULE_NAME: ShimulatorProtocol
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: SimulatorIPC-iOS
      - sdk: Foundation.framework

  ShimulatorAudioInjectionCore:
    type: library.static
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AudioInjection/AudioInjectionController.swift
    settings:
      base:
        SDKROOT: iphonesimulator
        PRODUCT_MODULE_NAME: ShimulatorAudioInjectionCore
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: ShimulatorProtocol-iOS
      - sdk: Foundation.framework

  ShimulatorAudioInjectionHAL:
    type: library.static
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AudioInjection/AudioInjectionHAL.swift
    settings:
      base:
        SDKROOT: iphonesimulator
        PRODUCT_MODULE_NAME: ShimulatorAudioInjectionHAL
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/AudioInjection/include
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: ShimulatorAudioInjectionCore
      - sdk: CoreAudio.framework
      - sdk: Foundation.framework

  ShimulatorAudioInjectionInterpose:
    type: library.static
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AudioInjection/IDBAudioInjectionInterpose.c
    settings:
      base:
        SDKROOT: iphonesimulator
        HEADER_SEARCH_PATHS: $(SRCROOT)/AudioInjection/include
    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework

  ShimulatorAudioInjectionBootstrap:
    type: library.static
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AudioInjection/AudioInjectionBootstrap.swift
    settings:
      base:
        SDKROOT: iphonesimulator
        PRODUCT_MODULE_NAME: ShimulatorAudioInjectionBootstrap
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/AudioInjection/include
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: ShimulatorAudioInjectionCore
      - target: ShimulatorAudioInjectionHAL
      - target: ShimulatorProtocol-iOS
      - sdk: AudioToolbox.framework
      - sdk: Foundation.framework

  ShimulatorVideoInjectionCore:
    type: library.static
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VideoInjection/VideoInjectionController.swift
      - path: VideoInjection/VideoInjectionProtocol.swift
    settings:
      base:
        SDKROOT: iphonesimulator
        PRODUCT_MODULE_NAME: ShimulatorVideoInjectionCore
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: ShimulatorProtocol-iOS
      - sdk: Foundation.framework

  # FBReplGenerateSwiftInterface for the shim's REPL, as a static library so the shim's own sources are Objective-C.
  ReplRuntimeProbe-iOS:
    type: library.static
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Repl/RuntimeProbe
    settings:
      base:
        SDKROOT: iphonesimulator
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        PRODUCT_MODULE_NAME: ReplRuntimeProbe

  ReplRuntimeProbe-macOS:
    type: library.static
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Repl/RuntimeProbe
    settings:
      base:
        SDKROOT: macosx
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_MODULE_NAME: ReplRuntimeProbe

  ShimulatorVideoInjectionAVFoundation:
    type: library.static
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VideoInjection/ShimulatorVideoInjectionAVFoundation.m
      - path: VideoInjection/ShimulatorVideoInjectionAVFoundation.h
        headerVisibility: public
    settings:
      base:
        SDKROOT: iphonesimulator
        PRODUCT_MODULE_NAME: ShimulatorVideoInjectionAVFoundation
        DEFINES_MODULE: "YES"
        CLANG_ENABLE_OBJC_ARC: YES
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: Foundation.framework

  ShimulatorVideoInjectionCamera:
    type: library.static
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VideoInjection/CaptureSwizzles.swift
      - path: VideoInjection/VideoInjectionBootstrap.swift
      - path: VideoInjection/VirtualCamera.swift
    settings:
      base:
        SDKROOT: iphonesimulator
        PRODUCT_MODULE_NAME: ShimulatorVideoInjectionCamera
        SWIFT_VERSION: "5.0"
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/VideoInjection/include
    dependencies:
      - target: ShimulatorProtocol-iOS
      - target: ShimulatorVideoInjectionAVFoundation
      - target: ShimulatorVideoInjectionCore
      - sdk: Accelerate.framework
      - sdk: AVFoundation.framework
      - sdk: CoreImage.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Foundation.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework

  Shimulator-iOS:
    type: library.dynamic
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Configs/Shimulator-iOS.xcconfig
      Release: Configs/Shimulator-iOS.xcconfig
    sources:
      - path: Tools
      - path: TestReporterShim
      - path: TestCrashShim
      - path: TestLoadingShim
      - path: Repl
        excludes:
          - RuntimeProbe
    settings:
      base:
        SDKROOT: iphonesimulator
        PRODUCT_NAME: Shimulator-iOS
        EXECUTABLE_PREFIX: lib
        CODE_SIGN_IDENTITY: "-"
        CLANG_ENABLE_OBJC_ARC: NO
        GCC_PREPROCESSOR_DEFINITIONS: $(inherited) SENTEST_IGNORE_DEPRECATION_WARNING=1
        OTHER_CFLAGS: $(inherited) -Wno-deprecated-declarations
        # Package managers rewrite the dylib install ID to their install
        # prefix; leave header slack so the longer path fits without relinking.
        # The REPL's TestRepl subclasses XCTestCase, which only the xctest host provides, so its
        # two class symbols, and only those, are left to runtime resolution. `$$` is Xcode's literal `$`.
        OTHER_LDFLAGS: $(inherited) -all_load -Wl,-U,_OBJC_CLASS_$$_XCTestCase -Wl,-U,_OBJC_METACLASS_$$_XCTestCase -headerpad_max_install_names
        # Nothing in this target is Swift, so Xcode does not add the Swift back-deployment libraries its archives link.
        # Name the default toolchain explicitly: TOOLCHAIN_DIR can resolve to another installed toolchain, such as Metal's.
        LIBRARY_SEARCH_PATHS: $(inherited) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME)
    dependencies:
      - link: true
        target: ShimulatorAudioInjectionBootstrap
      - link: true
        target: ShimulatorAudioInjectionCore
      - link: true
        target: ShimulatorAudioInjectionHAL
      - link: true
        target: ShimulatorAudioInjectionInterpose
      - link: true
        target: ShimulatorProtocol-iOS
      - link: true
        target: ShimulatorVideoInjectionAVFoundation
      - link: true
        target: ShimulatorVideoInjectionCamera
      - link: true
        target: ShimulatorVideoInjectionCore
      - link: true
        target: SimulatorIPC-iOS
      - link: true
        target: ReplRuntimeProbe-iOS
      - sdk: Accelerate.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreAudio.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreImage.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Foundation.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework

  Shimulator-macOS:
    type: library.dynamic
    platform: macOS
    deploymentTarget: "15.0"
    configFiles:
      Debug: Configs/Shimulator-macOS.xcconfig
      Release: Configs/Shimulator-macOS.xcconfig
    sources:
      - path: Tools
      - path: TestReporterShim
      - path: TestCrashShim
      - path: TestLoadingShim
      - path: Repl
        excludes:
          - RuntimeProbe
    settings:
      base:
        SDKROOT: macosx
        PRODUCT_NAME: Shimulator-macOS
        EXECUTABLE_PREFIX: lib
        CODE_SIGN_IDENTITY: "-"
        CLANG_ENABLE_OBJC_ARC: NO
        GCC_PREPROCESSOR_DEFINITIONS: $(inherited) SENTEST_IGNORE_DEPRECATION_WARNING=1
        OTHER_CFLAGS: $(inherited) -Wno-deprecated-declarations
        # See Shimulator-iOS: header slack for install-name rewriting, and the XCTestCase symbols.
        OTHER_LDFLAGS: $(inherited) -Wl,-U,_OBJC_CLASS_$$_XCTestCase -Wl,-U,_OBJC_METACLASS_$$_XCTestCase -headerpad_max_install_names
        # Nothing in this target is Swift, so Xcode does not add the Swift back-deployment libraries ReplRuntimeProbe links.
        LIBRARY_SEARCH_PATHS: $(inherited) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME)
    dependencies:
      - link: true
        target: ReplRuntimeProbe-macOS
      - sdk: Foundation.framework
      - sdk: AppKit.framework
