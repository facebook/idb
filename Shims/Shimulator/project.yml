name: Shimulator

options:
  createIntermediateGroups: true

targets:
  SimulatorIPC-iOS:
    type: library.static
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ../../SimulatorIPC
    settings:
      base:
        SDKROOT: iphonesimulator
        PRODUCT_MODULE_NAME: SimulatorIPC
        SWIFT_VERSION: "6.0"
    dependencies:
      - sdk: Foundation.framework

  ShimulatorProtocol-iOS:
    type: library.static
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Protocol
    settings:
      base:
        SDKROOT: iphonesimulator
        PRODUCT_MODULE_NAME: ShimulatorProtocol
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: SimulatorIPC-iOS
      - sdk: Foundation.framework

  Shimulator-iOS:
    type: library.dynamic
    platform: iOS
    deploymentTarget: "15.0"
    configFiles:
      Debug: Configs/Shimulator-iOS.xcconfig
      Release: Configs/Shimulator-iOS.xcconfig
    sources:
      - path: Tools
      - path: TestReporterShim
      - path: TestCrashShim
      - path: TestLoadingShim
    settings:
      base:
        SDKROOT: iphonesimulator
        PRODUCT_NAME: Shimulator-iOS
        EXECUTABLE_PREFIX: lib
        CODE_SIGN_IDENTITY: "-"
        CLANG_ENABLE_OBJC_ARC: NO
        GCC_PREPROCESSOR_DEFINITIONS: $(inherited) SENTEST_IGNORE_DEPRECATION_WARNING=1
        OTHER_CFLAGS: $(inherited) -Wno-deprecated-declarations
        # Package managers rewrite the dylib install ID to their install
        # prefix; leave header slack so the longer path fits without relinking.
        OTHER_LDFLAGS: $(inherited) -headerpad_max_install_names
    dependencies:
      - sdk: Foundation.framework
      - sdk: UIKit.framework

  Shimulator-macOS:
    type: library.dynamic
    platform: macOS
    deploymentTarget: "15.0"
    configFiles:
      Debug: Configs/Shimulator-macOS.xcconfig
      Release: Configs/Shimulator-macOS.xcconfig
    sources:
      - path: Tools
      - path: TestReporterShim
      - path: TestCrashShim
      - path: TestLoadingShim
    settings:
      base:
        SDKROOT: macosx
        PRODUCT_NAME: Shimulator-macOS
        EXECUTABLE_PREFIX: lib
        CODE_SIGN_IDENTITY: "-"
        CLANG_ENABLE_OBJC_ARC: NO
        GCC_PREPROCESSOR_DEFINITIONS: $(inherited) SENTEST_IGNORE_DEPRECATION_WARNING=1
        OTHER_CFLAGS: $(inherited) -Wno-deprecated-declarations
        # See Shimulator-iOS: header slack for install-name rewriting.
        OTHER_LDFLAGS: $(inherited) -headerpad_max_install_names
    dependencies:
      - sdk: Foundation.framework
      - sdk: AppKit.framework
