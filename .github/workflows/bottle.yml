name: Bottle

# Builds Homebrew bottles for the facebook/fb tap formulae, attaches them to
# an existing GitHub release, and prints the `bottle do` blocks the follow-up
# tap commit needs. Dispatched manually because of an ordering constraint: a
# bottle is built by installing its formula, so the tap must already reference
# this release's assets — at the moment the Release workflow runs, the tap
# still points at the previous version. The per-release sequence is:
#
#   1. the Release workflow publishes this release's assets    (existing)
#   2. the tap bumps url/sha256/version to those assets        (existing)
#   3. this workflow builds and uploads the bottles            (this file)
#   4. the tap adds the `bottle do` blocks from the summary
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag the bottles attach to, e.g. v1.5.0.b4
        required: true
        type: string
      formulae:
        description: >-
          Comma-separated tap formulae to bottle. Defaults to idb-cli alone:
          its source install is the venv-and-pip work a bottle eliminates,
          while idb-companion's source install already unpacks a prebuilt
          tarball and idb is a tiny metapackage. Pass
          idb-companion,idb-cli,idb for uniform coverage.
        required: true
        type: string
        default: idb-cli

jobs:
  bottle:
    name: Build and publish bottles
    # The runner image decides the bottle's os/arch tag: macos-26 produces
    # arm64_tahoe bottles only. Users on anything else keep the source install.
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      FORMULAE: ${{ inputs.formulae }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@master
      - name: Tap facebook/fb
        run: brew tap facebook/fb

      # Refuse to build bottles for a version the tap does not reference yet;
      # without this the workflow happily bottles the previous release and
      # attaches it to the new tag. Checked against the first requested
      # formula, so lead the list with one whose version is bumped every
      # release — the idb metapackage often is not.
      - name: Check the tap is bumped
        run: |
          want="${TAG#v}"
          # PyPI normalizes prerelease versions per PEP 440 (1.5.0.b3 becomes
          # 1.5.0b3), and idb-cli's formula version derives from the published
          # wheel URL, so the tap may carry either spelling of the tag.
          want_pep440=$(printf '%s' "$want" | sed -E 's/\.((a|b|rc)[0-9]+)$/\1/')
          guard="${FORMULAE%%,*}"
          got=$(brew info --json=v2 "facebook/fb/$guard" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["formulae"][0]["versions"]["stable"])')
          if [ "$got" != "$want" ] && [ "$got" != "$want_pep440" ]; then
            echo "facebook/fb/$guard is at $got, expected $want (or $want_pep440): bump the tap before bottling"
            exit 1
          fi

      - name: Build bottles
        run: |
          for formula in ${FORMULAE//,/ }; do
            brew install --build-bottle "facebook/fb/$formula"
            brew bottle --json --no-rebuild \
              --root-url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
              "facebook/fb/$formula"
          done

      # `brew bottle` writes local files named `name--version.tag.bottle.tar.gz`,
      # but the URL Homebrew later requests under root_url uses a different
      # filename. Both spellings are recorded in the bottle JSON, so rename
      # from one to the other instead of assuming the dash convention.
      - name: Rename bottles to their download filenames
        run: |
          python3 - <<'EOF'
          import glob
          import json
          import os

          for path in sorted(glob.glob("*.bottle.json")):
              with open(path) as f:
                  doc = json.load(f)
              for entry in doc.values():
                  for tag_info in entry["bottle"]["tags"].values():
                      local, wanted = tag_info["local_filename"], tag_info["filename"]
                      if local != wanted:
                          os.rename(local, wanted)
                      print(f"{local} -> {wanted}")
          EOF

      - name: Upload bottles to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" ./*.bottle.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

      # The blocks below are also derivable from this JSON by tooling; the
      # artifact is the machine-readable counterpart of the human-readable
      # summary.
      - name: Upload the bottle JSON as a run artifact
        uses: actions/upload-artifact@v5
        with:
          name: bottle-json
          path: '*.bottle.json'
          if-no-files-found: error

      # Everything in the emitted blocks — root_url, cellar, os/arch tag,
      # sha256 — is read out of the `brew bottle --json` output, which is
      # reproduced verbatim below the blocks.
      - name: Emit the bottle blocks for the tap commit
        run: |
          python3 - "$GITHUB_STEP_SUMMARY" <<'EOF'
          import glob
          import json
          import sys

          def sha256_line(tag, tag_info, default_cellar):
              cellar = tag_info.get("cellar", default_cellar)
              sha = tag_info["sha256"]
              if cellar is None:
                  # Not reported: leave the DSL default rather than guess one.
                  return f'  sha256 {tag}: "{sha}"'
              cellar = str(cellar)
              if cellar.startswith(":"):
                  return f'  sha256 cellar: {cellar}, {tag}: "{sha}"'
              return f'  sha256 cellar: "{cellar}", {tag}: "{sha}"'

          blocks = []
          raws = []
          for path in sorted(glob.glob("*.bottle.json")):
              with open(path) as f:
                  raw = f.read()
              raws.append((path, raw.strip()))
              for name, entry in json.loads(raw).items():
                  bottle = entry["bottle"]
                  root_url = bottle["root_url"]
                  lines = ["bottle do", f'  root_url "{root_url}"']
                  if bottle.get("rebuild"):
                      rebuild = bottle["rebuild"]
                      lines.append(f"  rebuild {rebuild}")
                  for tag, tag_info in bottle["tags"].items():
                      lines.append(sha256_line(tag, tag_info, bottle.get("cellar")))
                  lines.append("end")
                  blocks.append((name, "\n".join(lines)))

          with open(sys.argv[1], "a") as out:
              out.write("## Add these `bottle do` blocks to the tap formulae\n\n")
              out.write("All values are taken from the `brew bottle --json` "
                        "output reproduced below, not inferred.\n\n")
              for name, block in blocks:
                  out.write(f"### `{name}`\n\n```ruby\n{block}\n```\n\n")
              out.write("## Raw `brew bottle --json` output\n\n")
              for path, raw in raws:
                  out.write(f"### `{path}`\n\n```json\n{raw}\n```\n\n")
          EOF
