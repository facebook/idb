name: Release
on:
  push:
    tags:
      - 'v*'
  # Dispatching with a version cuts a release without a local tag push: the
  # run creates the tag and the release itself at the dispatched commit.
  # Dispatching with the version left empty keeps the existing dry-run, where
  # only the build legs run.
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release version to cut, e.g. v1.5.0.b8. When set, the run creates
          the tag and release itself at the dispatched commit; when empty,
          the build legs run without releasing (the existing dry-run).
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # The single owner of `gh release create`: with both build jobs creating the
  # release concurrently, whichever won the race decided the release's title
  # and notes. Skipped on dry-run dispatches (no version to release); the
  # build jobs tolerate that skip explicitly below.
  create-release:
    name: Create the GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.version != '' }}
    env:
      # The tag this run releases: the pushed tag, or the dispatched version.
      # The expression works because && / || short-circuit to their operand
      # values, and inputs.version is empty both on tag pushes and on dry-run
      # dispatches.
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tolerate re-runs of the same tag: only create the release if it
          # does not already exist, and never mask a genuine creation failure.
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists, leaving it as-is"
          else
            # Mark prerelease-suffixed tags (v1.5.0.b3, v1.5.0.rc1) as
            # prereleases; a plain version tag becomes the repo's latest
            # release.
            prerelease=()
            case "$RELEASE_TAG" in
              *.a[0-9]*|*.b[0-9]*|*.rc[0-9]*) prerelease=(--prerelease) ;;
            esac
            # On a dispatch the tag does not exist yet: --target has
            # `gh release create` create it at the dispatched commit, under
            # the Actions bot identity. Tags created with GITHUB_TOKEN do not
            # trigger workflows, so this cannot start a second Release run.
            target=()
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              target=(--target "$GITHUB_SHA")
            fi
            gh release create "$RELEASE_TAG" "${prerelease[@]}" "${target[@]}" --title "$RELEASE_TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

  companion:
    name: Build and publish idb_companion
    runs-on: macos-26
    timeout-minutes: 120
    # `!cancelled()` suppresses the implicit success() so this still runs when
    # create-release is skipped (dry-run dispatch), while a failed or
    # cancelled create-release still blocks the upload legs.
    needs: [create-release]
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    env:
      XCODEGEN_STRIP_XATTRS: 'false'
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: brew install xcodegen protobuf swift-protobuf
      - name: Cache grpc-swift plugin
        uses: actions/cache@v5
        with:
          path: Build/grpc-swift
          key: grpc-swift-1.23.1-${{ runner.os }}
      - name: Build everything and assemble the distribution
        run: ./build.sh build all
      - name: Package
        id: package
        run: |
          tar -C Build/Distribution -czf idb-companion.macos-arm64.tar.gz .
          shasum -a 256 idb-companion.macos-arm64.tar.gz | tee idb-companion.macos-arm64.tar.gz.sha256
          echo "sha256=$(cut -d' ' -f1 idb-companion.macos-arm64.tar.gz.sha256)" >> "$GITHUB_OUTPUT"
      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: idb-companion
          path: idb-companion.macos-arm64.tar.gz*
      - name: Upload to release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" idb-companion.macos-arm64.tar.gz idb-companion.macos-arm64.tar.gz.sha256 --clobber --repo "$GITHUB_REPOSITORY"
      - name: Homebrew formula update instructions
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.version != '' }}
        run: |
          {
            echo '## Update the homebrew formulae'
            echo 'In the `facebook/fb` tap, this release is shipped as three formulae: `idb-companion.rb` (the companion server), `idb-cli.rb` (the python CLI), and `idb.rb` (a meta-formula that only depends on the other two). Update them for this release:'
            echo ''
            echo '- In `idb-companion.rb`, point the `url`/`sha256` at this tarball. The digest below is also published as the `idb-companion.macos-arm64.tar.gz.sha256` release asset:'
            echo '```ruby'
            echo "url \"https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/idb-companion.macos-arm64.tar.gz\""
            echo "sha256 \"${{ steps.package.outputs.sha256 }}\""
            echo '```'
            echo '- In `idb-companion.rb`, also update the explicit `version` stanza to match the tag: Homebrew mis-parses prerelease suffixes out of the URL.'
            echo '- In `idb-cli.rb`, update the `url` and `sha256` of the python sdist `resource` to the `fb_idb-*.tar.gz` attached to this release.'
            echo '- `idb.rb` only depends on the other two formulae, so it normally needs no change.'
            echo '- If the tarball layout changed since the previous release, review the `idb-companion.rb` `install` block as well: a url/sha bump alone can ship a formula that fails to install or installs a companion that crashes at runtime.'
          } >> "$GITHUB_STEP_SUMMARY"

  python-client:
    name: Build fb-idb distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # See companion: run on dry-run dispatch (create-release skipped), block
    # on failure.
    needs: [create-release]
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          pip install build
          # On a dry-run dispatch there is no release tag to derive a valid
          # PEP 440 version from; use a placeholder so the build legs stay
          # exercisable without one.
          case "$RELEASE_TAG" in
            v*) FB_IDB_VERSION="${RELEASE_TAG#v}" ;;
            *) FB_IDB_VERSION="0.0.0.dev0" ;;
          esac
          FB_IDB_VERSION="$FB_IDB_VERSION" python -m build
      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: fb-idb-dist
          path: dist/*
      - name: Attach to release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # Bottles idb-cli during the release itself. A bottle is built by installing
  # its formula, and the published tap still points at the previous release
  # while this run is in flight — so this job clones a WORKING COPY of the tap,
  # bumps idb-cli.rb to this run's own tag, and bottles from that. The tap
  # commit that publishes the bump and the bottle block together comes
  # afterwards, from release tooling, once this run's assets and bottle-json
  # artifact exist. This replaces the manually-dispatched Bottle workflow.
  #
  # Only idb-cli is bottled: its source install is the venv-and-pip work a
  # bottle eliminates, while idb-companion's source install already unpacks a
  # prebuilt tarball and idb is a tiny metapackage.
  bottle:
    name: Build and publish the idb-cli bottle
    # The runner image decides the bottle's os/arch tag: macos-26 produces
    # arm64_tahoe bottles only. Users on anything else keep the source install.
    runs-on: macos-26
    timeout-minutes: 30
    # Deliberately not gated on the companion build: the idb-cli formula only
    # needs the wheel, so bottling runs in parallel with the slow companion
    # job and adds no wall-clock time to the release.
    needs: [create-release, python-client]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.version != '' }}
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: Homebrew/actions/setup-homebrew@master

      - name: Clone a tap working copy
        run: git clone --depth 1 https://github.com/facebook/homebrew-fb tap

      - name: Download this release's wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --pattern 'fb_idb-*-py3-none-any.whl' --repo "$GITHUB_REPOSITORY"

      # No published-tap version guard is needed (the old Bottle workflow had
      # one): this job constructs the bump itself, from this run's own tag and
      # wheel, so tap/release version skew is impossible.
      - name: Bump idb-cli.rb in the working copy
        run: |
          python3 - <<'EOF'
          import glob
          import hashlib
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, ".github/scripts")
          import tap_formulae

          [wheel] = glob.glob("fb_idb-*-py3-none-any.whl")
          sha = hashlib.sha256(Path(wheel).read_bytes()).hexdigest()
          formula = Path("tap/idb-cli.rb")
          tag = os.environ["RELEASE_TAG"]
          formula.write_text(tap_formulae.rewrite_cli(formula.read_text(), tag, sha))
          print(f"{formula} -> {tag} ({wheel}: {sha})")
          EOF

      # brew only installs formulae out of its own tap directories, so expose
      # the bumped working copy as the facebook/fb tap.
      - name: Link the working copy as the facebook/fb tap
        run: |
          taps="$(brew --repository)/Library/Taps/facebook"
          mkdir -p "$taps"
          ln -s "$PWD/tap" "$taps/homebrew-fb"

      - name: Build the bottle
        run: |
          brew install --build-bottle facebook/fb/idb-cli
          brew bottle --json --no-rebuild \
            --root-url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG" \
            facebook/fb/idb-cli

      # `brew bottle` writes local files named `name--version.tag.bottle.tar.gz`,
      # but the URL Homebrew later requests under root_url uses a different
      # filename. Both spellings are recorded in the bottle JSON, so rename
      # from one to the other instead of assuming the dash convention.
      - name: Rename bottles to their download filenames
        run: |
          python3 - <<'EOF'
          import glob
          import json
          import os

          for path in sorted(glob.glob("*.bottle.json")):
              with open(path) as f:
                  doc = json.load(f)
              for entry in doc.values():
                  for tag_info in entry["bottle"]["tags"].values():
                      local, wanted = tag_info["local_filename"], tag_info["filename"]
                      if local != wanted:
                          os.rename(local, wanted)
                      print(f"{local} -> {wanted}")
          EOF

      - name: Upload bottles to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" ./*.bottle.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

      # The machine-readable counterpart of the summary below; release tooling
      # downloads it to write the bottle block into the tap commit.
      - name: Upload the bottle JSON as a run artifact
        uses: actions/upload-artifact@v5
        with:
          name: bottle-json
          path: '*.bottle.json'
          if-no-files-found: error

      # Everything in the emitted blocks — root_url, cellar, os/arch tag,
      # sha256 — is read out of the `brew bottle --json` output, which is
      # reproduced verbatim below the blocks.
      - name: Emit the bottle blocks for the tap commit
        run: |
          python3 - "$GITHUB_STEP_SUMMARY" <<'EOF'
          import glob
          import sys

          sys.path.insert(0, ".github/scripts")
          import tap_formulae

          blocks = tap_formulae.bottle_blocks_from_dir(".")
          with open(sys.argv[1], "a") as out:
              out.write("## Add these `bottle do` blocks to the tap formulae\n\n")
              out.write(
                  "All values are taken from the `brew bottle --json` "
                  "output reproduced below, not inferred.\n\n"
              )
              for name, block in blocks.items():
                  out.write(f"### `{name}`\n\n```ruby\n{block}\n```\n\n")
              out.write("## Raw `brew bottle --json` output\n\n")
              for path in sorted(glob.glob("*.bottle.json")):
                  with open(path) as f:
                      raw = f.read().strip()
                  out.write(f"### `{path}`\n\n```json\n{raw}\n```\n\n")
          EOF

  pypi-publish:
    name: Publish fb-idb to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [python-client]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.version != '' }}
    environment:
      name: pypi
      url: https://pypi.org/p/fb-idb
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: fb-idb-dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
