name: Release
on:
  push:
    tags:
      - 'v*'
  # Allows the build and packaging legs to be exercised without cutting a tag;
  # the release-creation steps only run on tag pushes.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The single owner of `gh release create`: with both build jobs creating the
  # release concurrently, whichever won the race decided the release's title
  # and notes. Skipped on workflow_dispatch (no tag to release); the build jobs
  # tolerate that skip explicitly below.
  create-release:
    name: Create the GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tolerate re-runs of the same tag: only create the release if it
          # does not already exist, and never mask a genuine creation failure.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, leaving it as-is"
          else
            gh release create "$GITHUB_REF_NAME" --prerelease --title "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

  companion:
    name: Build and publish idb_companion
    runs-on: macos-26
    timeout-minutes: 120
    # `!cancelled()` suppresses the implicit success() so this still runs when
    # create-release is skipped (workflow_dispatch), while a failed or
    # cancelled create-release still blocks the upload legs.
    needs: [create-release]
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    env:
      XCODEGEN_STRIP_XATTRS: 'false'
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: brew install xcodegen protobuf swift-protobuf
      - name: Cache grpc-swift plugin
        uses: actions/cache@v5
        with:
          path: Build/grpc-swift
          key: grpc-swift-1.23.1-${{ runner.os }}
      - name: Build everything and assemble the distribution
        run: ./build.sh build all
      - name: Package
        id: package
        run: |
          tar -C Build/Distribution -czf idb-companion.macos-arm64.tar.gz .
          shasum -a 256 idb-companion.macos-arm64.tar.gz | tee idb-companion.macos-arm64.tar.gz.sha256
          echo "sha256=$(cut -d' ' -f1 idb-companion.macos-arm64.tar.gz.sha256)" >> "$GITHUB_OUTPUT"
      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: idb-companion
          path: idb-companion.macos-arm64.tar.gz*
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" idb-companion.macos-arm64.tar.gz idb-companion.macos-arm64.tar.gz.sha256 --clobber --repo "$GITHUB_REPOSITORY"
      - name: Homebrew formula update instructions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          {
            echo '## Update the homebrew formulae'
            echo 'In the `facebook/fb` tap, this release is shipped as three formulae: `idb-companion.rb` (the companion server), `idb-cli.rb` (the python CLI), and `idb.rb` (a meta-formula that only depends on the other two). Update them for this release:'
            echo ''
            echo '- In `idb-companion.rb`, point the `url`/`sha256` at this tarball. The digest below is also published as the `idb-companion.macos-arm64.tar.gz.sha256` release asset:'
            echo '```ruby'
            echo "url \"https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/idb-companion.macos-arm64.tar.gz\""
            echo "sha256 \"${{ steps.package.outputs.sha256 }}\""
            echo '```'
            echo '- In `idb-companion.rb`, also update the explicit `version` stanza to match the tag: Homebrew mis-parses prerelease suffixes out of the URL.'
            echo '- In `idb-cli.rb`, update the `url` and `sha256` of the python sdist `resource` to the `fb_idb-*.tar.gz` attached to this release.'
            echo '- `idb.rb` only depends on the other two formulae, so it normally needs no change.'
            echo '- If the tarball layout changed since the previous release, review the `idb-companion.rb` `install` block as well: a url/sha bump alone can ship a formula that fails to install or installs a companion that crashes at runtime.'
          } >> "$GITHUB_STEP_SUMMARY"

  python-client:
    name: Build fb-idb distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # See companion: run on dispatch (create-release skipped), block on failure.
    needs: [create-release]
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          pip install build
          # On workflow_dispatch the ref is a branch name, which is not a valid
          # PEP 440 version; use a placeholder so the build legs stay
          # exercisable without a tag.
          case "$GITHUB_REF" in
            refs/tags/v*) FB_IDB_VERSION="${GITHUB_REF_NAME#v}" ;;
            *) FB_IDB_VERSION="0.0.0.dev0" ;;
          esac
          FB_IDB_VERSION="$FB_IDB_VERSION" python -m build
      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: fb-idb-dist
          path: dist/*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  pypi-publish:
    name: Publish fb-idb to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [python-client]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/fb-idb
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: fb-idb-dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
