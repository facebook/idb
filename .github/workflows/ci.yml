name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-client:
    name: Python client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fb-idb from source
        run: FB_IDB_VERSION=0.0.0 pip install .
      - name: Smoke test the CLI
        run: idb --help
      - name: Run unit tests
        # The suites ship inside the package as *_tests.py, which pytest's
        # default discovery pattern does not match. Run outside the checkout:
        # from the repo root the source idb/ tree — which lacks the generated
        # gRPC modules — shadows the installed package and breaks collection.
        working-directory: ${{ runner.temp }}
        run: |
          pip install pytest
          python -m pytest --pyargs idb -o python_files='*_tests.py'

  mac-frameworks:
    name: Build frameworks (macOS)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # Runner filesystems support xattrs; generate projects in place rather
      # than through the temp-dir workaround for xattr-restricted filesystems,
      # whose pbxproj path rewrite mangles references reaching more than one
      # directory level up.
      XCODEGEN_STRIP_XATTRS: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen
      - name: Build frameworks
        run: ./build.sh build frameworks

  mac-tests:
    name: Test ${{ matrix.target }} (macOS)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      XCODEGEN_STRIP_XATTRS: 'false'
      # xcodebuild only forwards TEST_RUNNER_-prefixed variables into the test
      # process; the in-test environment gates (XCTSkipIf on GITHUB_ACTIONS)
      # never see the job env without this.
      TEST_RUNNER_GITHUB_ACTIONS: 'true'
    strategy:
      fail-fast: false
      matrix:
        target:
          - FBControlCore
          - XCTestBootstrap
          - FBSimulatorControl
          - FBDeviceControl
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen
      - name: Test ${{ matrix.target }}
        run: ./build.sh test ${{ matrix.target }}
      # Hosted runners otherwise yield nothing beyond a failing test's name;
      # the result bundle carries per-test failure detail and, for tests
      # killed by the time allowance, a snapshot of where they were stuck.
      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-xcresult
          path: Build/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 14

  mac-companion:
    name: Build companion + distribution (macOS)
    runs-on: macos-26
    timeout-minutes: 90
    env:
      XCODEGEN_STRIP_XATTRS: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen protobuf swift-protobuf
      # build.sh compiles protoc-gen-grpc-swift from source on first run;
      # cache that build to keep this job fast.
      - name: Cache grpc-swift plugin
        uses: actions/cache@v4
        with:
          path: Build/grpc-swift
          key: grpc-swift-1.23.1-${{ runner.os }}
      - name: Build everything and assemble the distribution
        run: ./build.sh build all
      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: idb-companion-distribution
          path: Build/Distribution
